source = $HOME/.config/hypr/mocha.conf
$font = Iosevka Medium

# GENERAL
general {
  disable_loading_bar = true
  hide_cursor = false
}

# BACKGROUND
background {
  path = $HOME/.local/share/lockscreen_wallpaper
# blur_passes = 3
# blur_size = 5
}


animations {
  bezier = quick, 0.15, 0, 0.1, 1
  bezier = linear, 1, 1, 0, 0
  bezier = easeInSine,0.12,0,0.39,0
  bezier = easeOutSine,0.61,1,0.88,1
  bezier = easeInOutSine,0.37,0,0.63,1
  bezier = easeOutQuint,0.23,1,0.32,1
  bezier = easeInOutCubic,0.65,0.05,0.36,1
  animation = fadeIn, 1, 6, linear
  animation = inputFieldDots, 0, 2, quick
  animation = inputFieldWidth, 1, 3, quiick
  animation = inputFieldColors, 1, 3, quick
  animation = inputFieldFade, 1, 3, quick
}

# TIME
label {
  monitor =
  text = $TIME
  color = $text
  font_size = 90
  font_family = $font
  position = 0, 265
  halign = center
  valign = center
}

# DATE
label {
  monitor =
  text = cmd[update:43200000] date +"%A, %d %B %Y"
  color = $text
  font_size = 25
  font_family = $font
  position = 0, 165
  halign = center
  valign = center
}

# Profile
label {
    monitor =
    text = 
    font_family = Font Awesome 6 Pro Thin
    font_size = 90
    color = $text
    position = 0, 45
    halign = center
    valign = center
}

label {
    monitor =
    text = MOJAHED
    color = $text
    font_size = 20
    font_family = $font
    position = 0, -50
    halign = center
    valign = center
}


label {
    monitor =
    text = Hi there!, $USER
    color = $text
    font_size = 15
    font_family = $font
    position = 0, 20
    halign = center
    valign = bottom
}


# INPUT FIELD
input-field {
  monitor =
  size = 300, 45
  rounding = 10
  outline_thickness = 2
  dots_size = 0.2
  dots_spacing = 0.2
  dots_center = true
  outer_color = $text
  inner_color = rgba(255, 255, 255, 0.05)
  font_color = $text
  fade_on_empty = false
  placeholder_text = Enter Password
  font_family = Iosevka Medium Italic
  hide_input = false
  check_color = #71C0B6
  fail_color = #E34F4F
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  capslock_color = $yellow
  position = 0, -120
  halign = center
  valign = center
}

# KEYBOARD LAYOUT
label {
  monitor =
  text = cmd[update:300] echo "$(~/.config/hypr/kb_layout.sh)"
  text_align = center
  color = $text
  font_size = 12
  font_family = Iosevka Medium, Font Awesome 6 Pro
  rotate = 0 # degrees, counter-clockwise

  position = 10, 20
  halign = left
  valign = bottom
}

# CURRENT SONG
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/songdetail.sh)"
    color = $text
    font_size = 16
    font_family = Iosevka Medium, Font Awesome 6 Pro
    position = 0, 80
    halign = center
    valign = bottom
}
