term=xterm-256color
font=monospace:Bold:size=12
dpi-aware=yes
pad=20x20

[bell]
urgent=no
notify=no

[scrollback]
lines=20000
multiplier=3.0
indicator-position=relative

[mouse]
hide-when-typing=no

[cursor]
color = 282C34 d8dee9
style = underline
blink = true

[cursor]
color=11111b f5e0dc

[colors]
alpha=0.70
foreground=cdd6f4
background=1e1e2e

regular0=45475a
regular1=f38ba8
regular2=a6e3a1
regular3=f9e2af
regular4=89b4fa
regular5=f5c2e7
regular6=94e2d5
